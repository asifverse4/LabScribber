<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Analysis workflow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Analysis workflow</title>
<defs><linearGradient id="rail2" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0"><stop offset="0" stop-color="#5FD6CF"/><stop offset="1" stop-color="#D4B483"/></linearGradient><linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5FD6CF"/><stop offset="1" stop-color="#D4B483"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#F4E7CC"/><stop offset=".55" stop-color="#D4B483"/><stop offset="1" stop-color="#8E7444"/></radialGradient></defs>
<style>
text{font-family:'Segoe UI','SF Pro Text','Helvetica Neue',Arial,sans-serif} .mono{font-family:'Cascadia Mono','SF Mono',Consolas,Menlo,monospace}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.fw{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
.b{animation:bob 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="210" fill="#060A12"/>
<line x1="110" y1="80" x2="1090" y2="80" stroke="url(#rail2)" stroke-opacity=".25" stroke-width="2"/>
<line class="fw" x1="110" y1="80" x2="1090" y2="80" stroke="url(#rail2)" stroke-width="2"/>

<g transform="translate(110,80)"><g class="b" style="animation-delay:0.0s"><ellipse cx="0" cy="34" rx="22" ry="5" fill="#5FD6CF" fill-opacity=".18"/><circle r="26" fill="#0C1424" stroke="url(#rail)" stroke-width="1.5"/><circle r="17" fill="url(#orb)"/><text y="4.5" fill="#060A12" font-size="12" text-anchor="middle" font-weight="700" class="mono">01</text></g><text y="68" fill="#EDE3CF" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">IMPORT</text><text y="88" fill="#8FA3BF" font-size="11" text-anchor="middle">JCAMP · Excel · text</text></g>
<g transform="translate(306,80)"><g class="b" style="animation-delay:-0.7s"><ellipse cx="0" cy="34" rx="22" ry="5" fill="#5FD6CF" fill-opacity=".18"/><circle r="26" fill="#0C1424" stroke="url(#rail)" stroke-width="1.5"/><circle r="17" fill="url(#orb)"/><text y="4.5" fill="#060A12" font-size="12" text-anchor="middle" font-weight="700" class="mono">02</text></g><text y="68" fill="#EDE3CF" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">BASELINE</text><text y="88" fill="#8FA3BF" font-size="11" text-anchor="middle">Correction</text></g>
<g transform="translate(502,80)"><g class="b" style="animation-delay:-1.4s"><ellipse cx="0" cy="34" rx="22" ry="5" fill="#5FD6CF" fill-opacity=".18"/><circle r="26" fill="#0C1424" stroke="url(#rail)" stroke-width="1.5"/><circle r="17" fill="url(#orb)"/><text y="4.5" fill="#060A12" font-size="12" text-anchor="middle" font-weight="700" class="mono">03</text></g><text y="68" fill="#EDE3CF" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">PEAKS</text><text y="88" fill="#8FA3BF" font-size="11" text-anchor="middle">Detection</text></g>
<g transform="translate(698,80)"><g class="b" style="animation-delay:-2.0999999999999996s"><ellipse cx="0" cy="34" rx="22" ry="5" fill="#5FD6CF" fill-opacity=".18"/><circle r="26" fill="#0C1424" stroke="url(#rail)" stroke-width="1.5"/><circle r="17" fill="url(#orb)"/><text y="4.5" fill="#060A12" font-size="12" text-anchor="middle" font-weight="700" class="mono">04</text></g><text y="68" fill="#EDE3CF" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">DECONVOLVE</text><text y="88" fill="#8FA3BF" font-size="11" text-anchor="middle">Fit + uncertainty</text></g>
<g transform="translate(894,80)"><g class="b" style="animation-delay:-2.8s"><ellipse cx="0" cy="34" rx="22" ry="5" fill="#5FD6CF" fill-opacity=".18"/><circle r="26" fill="#0C1424" stroke="url(#rail)" stroke-width="1.5"/><circle r="17" fill="url(#orb)"/><text y="4.5" fill="#060A12" font-size="12" text-anchor="middle" font-weight="700" class="mono">05</text></g><text y="68" fill="#EDE3CF" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">CHEMOMETRICS</text><text y="88" fill="#8FA3BF" font-size="11" text-anchor="middle">PCA · MCR-ALS · PLS</text></g>
<g transform="translate(1090,80)"><g class="b" style="animation-delay:-3.5s"><ellipse cx="0" cy="34" rx="22" ry="5" fill="#5FD6CF" fill-opacity=".18"/><circle r="26" fill="#0C1424" stroke="url(#rail)" stroke-width="1.5"/><circle r="17" fill="url(#orb)"/><text y="4.5" fill="#060A12" font-size="12" text-anchor="middle" font-weight="700" class="mono">06</text></g><text y="68" fill="#EDE3CF" font-size="14" text-anchor="middle" letter-spacing="2" font-weight="600">REPORT</text><text y="88" fill="#8FA3BF" font-size="11" text-anchor="middle">Figures · methods</text></g>
<circle r="4" fill="#F4E7CC"><animateMotion dur="7s" repeatCount="indefinite" path="M110,80 L1090,80"/></circle>
</svg>