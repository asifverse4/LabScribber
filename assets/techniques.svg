<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Supported techniques" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Supported techniques</title>
<defs>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E7CC"/><stop offset="1" stop-color="#D4B483"/></linearGradient>
<linearGradient id="lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27415A"/><stop offset="1" stop-color="#101C2E"/></linearGradient>
<linearGradient id="rt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16293F"/><stop offset="1" stop-color="#0A1220"/></linearGradient>
<radialGradient id="sh"><stop offset="0" stop-color="#5FD6CF" stop-opacity=".35"/><stop offset="1" stop-color="#5FD6CF" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:'Segoe UI','SF Pro Text','Helvetica Neue',Arial,sans-serif} .mono{font-family:'Cascadia Mono','SF Mono',Consolas,Menlo,monospace}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sh{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.c{animation:fl 5s ease-in-out infinite}
.d{transform-box:fill-box;transform-origin:center;animation:sh 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="280" fill="#060A12"/>
<rect width="1200" height="280" fill="#0C1424" fill-opacity=".0"/>

